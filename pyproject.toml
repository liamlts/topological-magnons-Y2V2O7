[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "y2v2o7"
version = "0.1.0"
description = "LSWT, Berry curvature and cluster helpers for the Y2V2O7 topological-magnon paper"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "scipy>=1.8", "matplotlib>=3.5"]

[project.optional-dependencies]
edrixs = ["edrixs>=0.0.4"]
test = ["pytest"]

[tool.setuptools]
packages = ["y2v2o7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
